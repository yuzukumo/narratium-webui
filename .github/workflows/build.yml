name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://narratium:narratium_test_password@127.0.0.1:5432/narratium_test?sslmode=disable
    services:
      narratium-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: narratium_test
          POSTGRES_USER: narratium
          POSTGRES_PASSWORD: narratium_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U narratium -d narratium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server

  container:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [frontend, backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: |
            ghcr.io/yuzukumo/narratium-webui:latest-${{ matrix.architecture }}
            ghcr.io/yuzukumo/narratium-webui:sha-${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}

  manifest:
    needs: container
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/yuzukumo/narratium-webui:latest \
            ghcr.io/yuzukumo/narratium-webui:latest-amd64 \
            ghcr.io/yuzukumo/narratium-webui:latest-arm64
          docker buildx imagetools create \
            --tag ghcr.io/yuzukumo/narratium-webui:sha-${{ github.sha }} \
            ghcr.io/yuzukumo/narratium-webui:sha-${{ github.sha }}-amd64 \
            ghcr.io/yuzukumo/narratium-webui:sha-${{ github.sha }}-arm64
