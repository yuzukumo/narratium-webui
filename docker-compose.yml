services:
  narratium:
    container_name: narratium
    image: ghcr.io/yuzukumo/narratium-webui:latest
    build:
      context: .
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      NARRATIUM_MAX_BLOB_TOTAL_GB: "2"
      # Required. Use a stable random value of at least 32 characters and never change it.
      NARRATIUM_SECRET: "${NARRATIUM_SECRET:?set NARRATIUM_SECRET to a random value of at least 32 characters}"
    depends_on:
      narratium-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  narratium-postgres:
    container_name: narratium-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: narratium
      POSTGRES_USER: narratium
      POSTGRES_PASSWORD: narratium
    volumes:
      - narratium-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narratium -d narratium"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  narratium-postgres:
